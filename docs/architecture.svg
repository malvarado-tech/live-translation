<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">The operator browser streams microphone audio to the OpenAI realtime translation model over WebRTC, republishes the translated audio through a self-hosted LiveKit server, and listener phones subscribe to it. Next.js API routes mint the short-lived credentials.</desc>
  <style>
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .accent { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .server { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .title { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .sub { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
    .code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #334155; }
    .lbl { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #334155; }
    .flow { stroke: #059669; stroke-width: 2; fill: none; }
    .cred { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    .headf { fill: #059669; }
    .headc { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #0f172a; stroke: #64748b; }
      .accent { fill: #052e22; stroke: #34d399; }
      .server { fill: #111827; stroke: #94a3b8; }
      .title { fill: #f1f5f9; }
      .sub, .lbl { fill: #cbd5e1; }
      .code { fill: #e2e8f0; }
      .flow { stroke: #34d399; }
      .headf { fill: #34d399; }
      .cred { stroke: #94a3b8; }
      .headc { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="headf"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="headc"/></marker>
  </defs>

  <!-- OpenAI -->
  <rect x="250" y="20" width="250" height="70" rx="10" class="box"/>
  <text x="375" y="50" text-anchor="middle" class="title">OpenAI Realtime API</text>
  <text x="375" y="72" text-anchor="middle" class="code">gpt-realtime-translate</text>

  <!-- Speaker -->
  <rect x="20" y="180" width="160" height="70" rx="10" class="box"/>
  <text x="100" y="210" text-anchor="middle" class="title">Speaker</text>
  <text x="100" y="232" text-anchor="middle" class="sub">microphone or line in</text>

  <!-- Operator -->
  <rect x="250" y="170" width="250" height="90" rx="10" class="accent"/>
  <text x="375" y="203" text-anchor="middle" class="title">Operator browser</text>
  <text x="375" y="224" text-anchor="middle" class="code">/operator</text>
  <text x="375" y="244" text-anchor="middle" class="sub">QR code, devices, telemetry</text>

  <!-- LiveKit -->
  <rect x="570" y="170" width="170" height="90" rx="10" class="box"/>
  <text x="655" y="203" text-anchor="middle" class="title">LiveKit server</text>
  <text x="655" y="224" text-anchor="middle" class="sub">self-hosted SFU</text>
  <text x="655" y="244" text-anchor="middle" class="sub">1 publisher, N subscribers</text>

  <!-- Listeners -->
  <rect x="790" y="170" width="150" height="90" rx="10" class="accent"/>
  <text x="865" y="203" text-anchor="middle" class="title">Listener phones</text>
  <text x="865" y="224" text-anchor="middle" class="code">/listen/[room]</text>
  <text x="865" y="244" text-anchor="middle" class="sub">audio and captions</text>

  <!-- Next.js server -->
  <rect x="250" y="340" width="490" height="100" rx="10" class="server"/>
  <text x="495" y="368" text-anchor="middle" class="title">Next.js route handlers (hold the long-lived keys)</text>
  <text x="495" y="394" text-anchor="middle" class="code">POST /api/session  ·  POST /api/publish-token</text>
  <text x="495" y="418" text-anchor="middle" class="code">GET /api/listen-token  ·  POST /api/save-benchmark</text>

  <!-- media flows -->
  <path d="M180 215 H246" class="flow" marker-end="url(#af)"/>
  <path d="M345 166 V94" class="flow" marker-end="url(#af)"/>
  <path d="M405 94 V166" class="flow" marker-end="url(#af)"/>
  <text x="335" y="135" text-anchor="end" class="lbl">mic audio</text>
  <text x="415" y="128" class="lbl">translated audio</text>
  <text x="415" y="145" class="lbl">and transcript (WebRTC)</text>
  <path d="M500 215 H566" class="flow" marker-end="url(#af)"/>
  <text x="533" y="205" text-anchor="middle" class="lbl">publish</text>
  <path d="M740 215 H786" class="flow" marker-end="url(#af)"/>
  <text x="763" y="205" text-anchor="middle" class="lbl">fan-out</text>

  <!-- credential flows -->
  <path d="M375 336 V264" class="cred" marker-end="url(#ac)"/>
  <text x="385" y="296" class="lbl">client secret,</text>
  <text x="385" y="312" class="lbl">publish token</text>
  <path d="M740 390 H865 V264" class="cred" marker-end="url(#ac)"/>
  <text x="875" y="320" class="lbl">listen</text>
  <text x="875" y="336" class="lbl">token</text>
</svg>
